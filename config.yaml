# AI问答后端服务配置
service:
  host: 0.0.0.0
  port: 8840
  debug: true

vector_db:
  type: chroma
  persist_directory: ./data/chroma_db
  collection_name: knowledge_base_prod
  # 题目库集合配置
  question_collections:
    master: generated_questions_master  # 主库：所有用户题目
    user_prefix: generated_questions_user  # 子库前缀：每个用户单独库

ai:
  provider: dashscope
  model: qwen3.6-plus
  temperature: 0.7
  max_tokens: 15000

embedding:
  provider: ollama
  model: bge-m3

prompt:
  system_template: "你是一个专业的问答助手，请根据提供的上下文信息回答用户的问题。"
  user_template: |
    上下文信息：
    {context}

    用户问题：{question}

    请根据以上上下文信息回答问题。